<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<title>🦖 공룡 달리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #f7f7f7; color: #535353;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'PingFang SC', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    transition: background .6s, color .6s;
  }
  body.night { background: #202124; color: #acacac; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; letter-spacing: 1px; text-align: center; }
  .sub { font-size: 13px; opacity: .7; margin-bottom: 18px; text-align: center; line-height: 1.8; }
  #stage { width: 100%; max-width: 820px; position: relative; touch-action: none; cursor: pointer; }
  canvas { display: block; width: 100%; image-rendering: pixelated; transition: filter .6s; }
  body.night canvas { filter: invert(1) hue-rotate(180deg); }
  .pad { display: flex; gap: 12px; width: 100%; max-width: 820px; margin-top: 18px; }
  .pad button {
    flex: 1; font: inherit; font-size: 15px; font-weight: 700; padding: 20px 0; border-radius: 14px;
    border: 3px solid currentColor; background: transparent; color: inherit;
    touch-action: none; cursor: pointer; line-height: 1.6;
  }
  .pad button.on { background: rgba(83,83,83,.15); transform: translateY(2px); }
  .pad .jump { flex: 2; }
  .help { font-size: 12px; opacity: .55; margin-top: 16px; line-height: 2; text-align: center; }
  .links { margin-top: 18px; font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .links a { color: inherit; opacity: .7; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
  <h1>🦖 공룡 달리기</h1>
  <div class="sub">인터넷이 끊겼을 때 나오는 그 게임!</div>

  <div id="stage"><canvas id="game"></canvas></div>

  <div class="pad">
    <button class="duck" id="btnDuck">▼<br>숙이기</button>
    <button class="jump" id="btnJump">▲<br>점프</button>
  </div>

  <div class="help">
    화면 탭 / SPACE / ↑ = 점프 (길게 누르면 더 높이)<br>
    ↓ = 숙이기 · 익룡은 숙여서 피하세요!
  </div>
  <div class="links">
    <a href="./">← 실시간 통역</a>
    <a href="./balance_game.html">밸런스 게임 →</a>
  </div>

<script>
(() => {
  // ───────── Config ─────────
  const W = innerWidth < 640 ? 440 : 600;   // 좁은 화면(모바일)은 시야를 줄이고 속도도 비례 축소
  const H = 200, GROUND = 178, P = 2, DINO_X = 36;
  const SF = W / 600;
  const START_SPEED = 360 * SF, MAX_SPEED = 820 * SF, ACCEL = 7 * SF;
  const GRAVITY = 2300, JUMP_V = 640, JUMP_CUT = 330;
  const FG = '#535353', BG = '#f7f7f7', CLOUD = '#d0d0d0';

  // ───────── Pixel sprites ('#' = ink, 'o' = background hole) ─────────
  const DINO_TOP = [
    "           ######## ",
    "          ##o#######",
    "          ##########",
    "          ##########",
    "          #####     ",
    "          ########  ",
    "#        #####      ",
    "#       ######      ",
    "##    ##########    ",
    "###  ######### #    ",
    "############        ",
    "############        ",
    " ##########         ",
    "  ########          ",
    "   ######           ",
    "    #####           ",
  ];
  const DINO_DEAD_TOP = DINO_TOP.map((r, i) =>
    i === 1 ? "          #ooo######" : i === 2 ? "          #o#o######" : i === 3 ? "          #ooo######" : r);
  const LEGS = {
    stand: ["    ##  ## ", "    #    # ", "    #    # ", "    ##   ##"],
    a:     ["    ##  ## ", "    ##   ##", "    #      ", "    ##     "],
    b:     ["    ##  ## ", "    #   ## ", "         # ", "         ##"],
  };
  const DUCK_A = [
    "#                  ######## ",
    "##    ########    ##o#######",
    "##########################  ",
    "######################      ",
    " ##################  ##     ",
    "  ##############            ",
    "    ##   ##                 ",
    "    #     ##                ",
    "    ##                      ",
  ];
  const DUCK_B = DUCK_A.slice(0, 6).concat([
    "    ##   ##                 ",
    "     ##   #                 ",
    "          ##                ",
  ]);
  const PTERO_A = [
    "      #               ",
    "      ##              ",
    "      ###             ",
    "   #  ####            ",
    "  ###  ####           ",
    " ##o#  #####          ",
    "######################",
    "     ###############  ",
    "       ##########     ",
    "        ######        ",
    "                      ",
  ];
  const PTERO_B = [
    "                      ",
    "                      ",
    "                      ",
    "   #                  ",
    "  ###                 ",
    " ##o#                 ",
    "######################",
    "     ###############  ",
    "       ##########     ",
    "        #######       ",
    "        #####         ",
    "        ###           ",
  ];
  const CLOUD_S = [
    "      #####       ",
    "    ##     ##     ",
    "  ##         ###  ",
    " #              # ",
    "##################",
  ];
  // Cactus as rect lists in pixel units: [x, y, w, h]
  const CACTUS = {
    small: { w: 7,  h: 17, r: [[2,0,3,17],[0,4,1,6],[0,9,2,2],[6,3,1,6],[5,8,2,2]] },
    big:   { w: 12, h: 25, r: [[4,0,4,25],[0,6,2,9],[0,13,4,2],[10,4,2,9],[8,11,4,2]] },
  };

  // ───────── Canvas setup ─────────
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  let S = 1;   // logical → device pixel scale
  function resize() {
    const cssW = cv.parentElement.clientWidth, dpr = window.devicePixelRatio || 1;
    cv.style.height = (cssW * H / W) + 'px';
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssW * H / W * dpr);
    S = cv.width / W;
    ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', resize); resize();

  // 모든 블록을 디바이스 픽셀 격자에 맞춰 픽셀 틈 방지
  const snap = v => Math.round(v * S) / S;
  function block(x, y, w, h) {
    const x0 = snap(x), y0 = snap(y);
    ctx.fillRect(x0, y0, snap(x + w) - x0, snap(y + h) - y0);
  }
  function sprite(rows, x, y, color = FG) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === ' ') continue;
        let run = 1;   // 같은 색 가로 픽셀 병합
        while (row[c + run] === ch) run++;
        ctx.fillStyle = ch === 'o' ? BG : color;
        block(x + c * P, y + r * P, run * P, P);
        c += run - 1;
      }
    }
  }

  // ───────── Sound (WebAudio blips) ─────────
  let ac = null;
  function beep(freq, dur, type = 'square', vol = 0.04, delay = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  // ───────── State ─────────
  let state = 'ready', speed, dist, score, milestone, flashT, overAt = 0, animT = 0, night = false;
  let hi = +localStorage.getItem('dinoHi') || 0;
  let obstacles = [], clouds = [], bumps = [], nextGap = 0;
  const dino = { dy: 0, vy: 0, onGround: true, duck: false, held: false };

  function reset() {
    speed = START_SPEED; dist = 0; score = 0; milestone = 0; flashT = 0; animT = 0;
    obstacles = []; nextGap = W * 0.6;
    Object.assign(dino, { dy: 0, vy: 0, onGround: true });
    setNight(false);
  }
  function setNight(v) { night = v; document.body.classList.toggle('night', v); }
  function initScenery() {
    clouds = []; bumps = [];
    for (let i = 0; i < 3; i++) clouds.push({ x: Math.random() * W, y: 20 + Math.random() * 60 });
    for (let x = 0; x < W + 40; x += 6 + Math.random() * 30) bumps.push({ x, y: 3 + Math.random() * 12, w: P * (1 + (Math.random() * 3 | 0)) });
  }
  reset(); initScenery();

  // ───────── Input ─────────
  function jumpDown() {
    dino.held = true;
    if (state === 'ready') { state = 'running'; doJump(); return; }
    if (state === 'over') { if (performance.now() - overAt > 600) { reset(); state = 'running'; } return; }
    if (dino.onGround && !dino.duck) doJump();
  }
  function doJump() { dino.vy = -JUMP_V; dino.onGround = false; beep(620, 0.07); }
  function jumpUp() { dino.held = false; if (!dino.onGround && dino.vy < -JUMP_CUT) dino.vy = -JUMP_CUT; }
  function duckDown() { if (state === 'running') dino.duck = true; }
  function duckUp() { dino.duck = false; }

  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) jumpDown(); }
    if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); duckDown(); }
  });
  addEventListener('keyup', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) jumpUp();
    if (['ArrowDown', 'KeyS'].includes(e.code)) duckUp();
  });
  function bindHold(el, down, up) {
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('on'); el.setPointerCapture?.(e.pointerId); down(); });
    const end = e => { el.classList.remove('on'); up(); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold(document.getElementById('stage'), jumpDown, jumpUp);
  bindHold(document.getElementById('btnJump'), jumpDown, jumpUp);
  bindHold(document.getElementById('btnDuck'), duckDown, duckUp);
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ───────── Obstacles ─────────
  const rand = (a, b) => a + Math.random() * (b - a);
  function spawn() {
    let o;
    if (score > 300 && Math.random() < 0.28) {
      const lv = [GROUND - 4, GROUND - 24, GROUND - 48][Math.random() * 3 | 0];
      o = { type: 'ptero', x: W + 10, bottom: lv, w: 44, h: 22, extra: rand(0, 40) * SF };
    } else {
      const big = Math.random() < 0.45, maxN = speed > 560 * SF ? 3 : 2;
      const n = 1 + (Math.random() * maxN | 0), c = big ? CACTUS.big : CACTUS.small;
      o = { type: 'cactus', big, n, x: W + 10, bottom: GROUND, w: n * c.w * P + (n - 1) * 2, h: c.h * P };
    }
    obstacles.push(o);
    nextGap = speed * rand(0.7, 1.4) + 110 * SF;
  }
  function obstacleBoxes(o) {
    const top = o.bottom - o.h;
    if (o.type === 'ptero') return [{ x: o.x + 2, y: top + 12, w: 40, h: 6 }, { x: o.x + 12, y: top + 4, w: 14, h: 14 }];
    return [{ x: o.x + 3, y: top + 3, w: o.w - 6, h: o.h - 3 }];
  }
  function dinoBoxes() {
    const b = GROUND + dino.dy;
    if (dino.duck && dino.onGround) return [{ x: DINO_X + 2, y: b - 16, w: 50, h: 12 }];
    const t = b - 40;
    return [
      { x: DINO_X + 22, y: t + 2, w: 16, h: 10 },
      { x: DINO_X + 2,  y: t + 14, w: 26, h: 14 },
      { x: DINO_X + 9,  y: t + 28, w: 12, h: 10 },
    ];
  }
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // ───────── Update ─────────
  function update(dt) {
    if (state !== 'running') return;
    speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
    dist += speed * dt;
    score = Math.floor(dist * 0.025 / SF);
    animT += dt;
    if (flashT > 0) flashT -= dt;

    const m = Math.floor(score / 100);
    if (m > milestone) { milestone = m; flashT = 0.9; beep(880, 0.08); beep(1320, 0.12, 'square', 0.04, 0.09); }
    const shouldNight = Math.floor(score / 700) % 2 === 1;
    if (shouldNight !== night) setNight(shouldNight);

    if (!dino.onGround) {
      dino.vy += GRAVITY * (dino.duck ? 3 : 1) * dt;
      dino.dy += dino.vy * dt;
      if (dino.dy >= 0) { dino.dy = 0; dino.vy = 0; dino.onGround = true; }
    }

    for (const o of obstacles) o.x -= (speed + (o.extra || 0)) * dt;
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    const last = obstacles[obstacles.length - 1];
    if (!last || last.x + last.w < W - nextGap) spawn();

    for (const c of clouds) { c.x -= speed * 0.15 * dt; if (c.x < -40) { c.x = W + rand(0, 200); c.y = 20 + rand(0, 60); } }
    for (const g of bumps) { g.x -= speed * dt; if (g.x < -10) { g.x += W + 40; g.y = 3 + rand(0, 12); } }

    const db = dinoBoxes();
    for (const o of obstacles) for (const ob of obstacleBoxes(o)) for (const d of db) if (hit(d, ob)) return gameOver();
  }
  function gameOver() {
    state = 'over'; overAt = performance.now(); dino.duck = false;
    if (score > hi) { hi = score; localStorage.setItem('dinoHi', hi); }
    beep(220, 0.12, 'square', 0.05); beep(110, 0.3, 'sawtooth', 0.05, 0.1);
    navigator.vibrate?.(120);
  }

  // ───────── Draw ─────────
  const pad5 = n => String(n).padStart(5, '0');
  function draw() {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

    for (const c of clouds) sprite(CLOUD_S, c.x, c.y, CLOUD);

    ctx.fillStyle = FG;
    block(0, GROUND - 1, W, P);
    for (const g of bumps) block(g.x, GROUND + g.y, g.w, P);

    for (const o of obstacles) {
      if (o.type === 'ptero') {
        const f = Math.floor(performance.now() / 160) % 2 ? PTERO_A : PTERO_B;
        sprite(f, o.x, o.bottom - f.length * P);
      } else {
        const c = o.big ? CACTUS.big : CACTUS.small;
        for (let i = 0; i < o.n; i++) {
          const bx = o.x + i * (c.w * P + 2), top = o.bottom - c.h * P;
          ctx.fillStyle = FG;
          for (const [x, y, w, h] of c.r) block(bx + x * P, top + y * P, w * P, h * P);
        }
      }
    }

    // Dino
    const b = GROUND + dino.dy;
    if (state === 'running' && dino.duck && dino.onGround) {
      const f = Math.floor(animT * 10) % 2 ? DUCK_A : DUCK_B;
      sprite(f, DINO_X, b - f.length * P);
    } else {
      const top = state === 'over' ? DINO_DEAD_TOP : DINO_TOP;
      let legs = LEGS.stand;
      if (state === 'running' && dino.onGround) legs = Math.floor(animT * 12) % 2 ? LEGS.a : LEGS.b;
      const rows = top.concat(legs);
      sprite(rows, DINO_X, b - rows.length * P);
    }

    // Score
    ctx.fillStyle = FG; ctx.textBaseline = 'top'; ctx.textAlign = 'right';
    ctx.font = '11px "Press Start 2P", monospace';
    const showScore = !(flashT > 0 && Math.floor(flashT * 8) % 2 === 0);
    ctx.fillText((hi ? '최고 ' + pad5(hi) + '  ' : '') + (showScore ? pad5(score) : '     '), W - 10, 10);

    ctx.textAlign = 'center';
    if (state === 'ready') {
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('화면을 탭하여 시작', W / 2, 78);
    } else if (state === 'over') {
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('게 임 오 버', W / 2, 56);
      // restart icon
      const cx = W / 2, cy = 102;
      ctx.strokeStyle = FG; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, 12, Math.PI * 0.25, Math.PI * 1.85); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 4, cy - 16); ctx.lineTo(cx + 14, cy - 10); ctx.lineTo(cx + 4, cy - 2); ctx.fill();
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('탭하여 다시 시작', W / 2, 126);
    }
  }

  // ───────── Loop ─────────
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.034, (now - lastT) / 1000); lastT = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.fonts?.ready?.then(draw);
})();
</script>
</body>
</html>
